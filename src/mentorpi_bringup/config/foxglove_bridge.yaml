# SD005 T2: read-only Foxglove bridge defaults for demo viewer.
# SD006 T3: /scan (LaserScan) and lidar TF are forwarded from the demo graph by default.
/**:
  ros__parameters:
    port: 8765
    address: "0.0.0.0"
    # No clientPublish/services: viewer cannot drive the robot via the bridge.
    capabilities:
      - parameters
      - parametersSubscribe
      - connectionGraph
      - assets
    client_topic_whitelist:
      - "(?!)"
    service_whitelist:
      - "(?!)"
    remote_access: false
    use_sim_time: false
