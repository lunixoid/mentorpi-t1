[workspace]
name = "mac-person-detect"
version = "0.2.2"
description = "Native macOS YOLO11n detect node: RGB in, Detection2DArray out. Not overlay, not t1ctl."
channels = [
  "https://prefix.dev/robostack-humble",
  "https://prefix.dev/conda-forge",
]
platforms = ["osx-arm64"]

[dependencies]
python = "3.11.*"
numpy = "*"
opencv = "*"
pytorch = "*"
torchvision = "*"
ultralytics = ">=8.4.135"
lap = ">=0.5.12"
ros-humble-rclpy = "*"
ros-humble-sensor-msgs = "*"
ros-humble-std-msgs = "*"
ros-humble-vision-msgs = "*"
ros-humble-cv-bridge = "*"
ros-humble-rmw-fastrtps-cpp = "*"
ros-humble-ros2cli = "*"
ros-humble-ros2topic = "*"

[activation]
scripts = ["activate-dds.sh"]

[activation.env]
ROS_DOMAIN_ID = "1"
ROS_LOCALHOST_ONLY = "0"
RMW_IMPLEMENTATION = "rmw_fastrtps_cpp"

[tasks]
person-detect = "python person_detect.py"
echo-detections = "ros2 topic echo /perception/detections_2d"
