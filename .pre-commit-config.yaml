exclude: |
  (?x)^(
    docs/vendor-docs/|
    build/|
    build-arm64/|
    build-test/|
    install/|
    log/|
    \.pixi/|
    host/t1ctl/build-host/
  )
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        args: ["--line-length=120"]
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length=120"]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - "--max-line-length=120"
          - "--extend-ignore=E203"
          - "--per-file-ignores=host/mac_person_detect/person_detect.py:E402"
  - repo: local
    hooks:
      - id: git-diff-check
        name: git diff --check
        language: system
        entry: git
        args: [--no-pager, diff, --check, HEAD, --]
        pass_filenames: true
