<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Вывод — калибровка лидар</title>
<link rel="stylesheet" href="design-system/tokens.css">
</head>
<body class="artifact cli">
  <div class="stage">
    <div class="artboard" data-screen-label="calib-lidar">
      <div class="term-chrome">
        <span class="term-title">t1ctl — calib lidar</span>
        <span class="term-meta">80×24</span>
      </div>
      <pre class="term" data-spec="cols: 80; rows: 24; command: t1ctl calib lidar; stdout; exit: 0; origin will be measured on accept; lang: en; stack: Clap; version: 1.4.1"><span class="prompt">$</span> <span class="cmd">t1ctl calib lidar --height 0.17 --pitch 0 --roll 0</span>
<span class="fg-muted">stage             </span>lidar
<span class="fg-muted">lidar z           </span>0.168 -> 0.170 m
<span class="fg-muted">lidar pitch       </span>0.0 -> 0.0 deg
<span class="fg-muted">lidar roll        </span>0.0 -> 0.0 deg

  t1ctl calib accept
  t1ctl calib reject</pre>
    </div>
  </div>
  <script>
    (function () {
      var ab = document.querySelector('.artboard');
      var W = 960, H = 612;
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        ab.style.transform = 'scale(' + s + ')';
        ab.style.transformOrigin = 'center center';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
