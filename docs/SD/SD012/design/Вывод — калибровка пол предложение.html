<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Вывод — калибровка пол предложение</title>
<link rel="stylesheet" href="design-system/tokens.css">
</head>
<body class="artifact cli">
  <div class="stage">
    <div class="artboard" data-screen-label="calib-floor-proposal">
      <div class="term-chrome">
        <span class="term-title">t1ctl — calib floor</span>
        <span class="term-meta">80×24</span>
      </div>
      <pre class="term" data-spec="cols: 80; rows: 24; command: t1ctl calib floor; stdout; exit: 0; next: accept|reject; lang: en; arrow: pose delta; stack: Clap; version: 1.4.1"><span class="prompt">$</span> <span class="cmd">t1ctl calib floor</span>
<span class="fg-muted">stage             </span>floor
<span class="fg-muted">residual          </span>0.031 -> 0.008 m
<span class="fg-muted">imu residual      </span>4.2 -> 0.4 deg
<span class="fg-muted">camera z          </span>0.177 -> 0.172 m
<span class="fg-muted">camera pitch      </span>0.0 -> 2.4 deg
<span class="fg-muted">imu pitch         </span>0.0 -> -4.1 deg

  t1ctl calib accept
  t1ctl calib reject</pre>
    </div>
  </div>
  <script>
    (function () {
      var ab = document.querySelector('.artboard');
      var W = 960, H = 612;
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        ab.style.transform = 'scale(' + s + ')';
        ab.style.transformOrigin = 'center center';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
