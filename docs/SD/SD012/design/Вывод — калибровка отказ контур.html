<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Вывод — калибровка отказ контур</title>
<link rel="stylesheet" href="design-system/tokens.css">
</head>
<body class="artifact cli">
  <div class="stage">
    <div class="artboard" data-screen-label="calib-error-contour">
      <div class="term-chrome">
        <span class="term-title">t1ctl — calib error</span>
        <span class="term-meta">80×24</span>
      </div>
      <pre class="term" data-spec="cols: 80; rows: 24; command: t1ctl calib floor; stdout: kv + next-step; stderr: error block; exit: 1; lang: en; stack: Clap; version: 1.4.1"><span class="prompt">$</span> <span class="cmd">t1ctl calib floor</span>
<span class="fg-muted">demo              </span><span class="fg-err">inactive</span>
<span class="fg-muted">stock             </span>inactive

<span class="bold fg-err">error:</span> calib floor failed
  container mentorpi-t1 is not running
  no camera depth

  t1ctl start</pre>
    </div>
  </div>
  <script>
    (function () {
      var ab = document.querySelector('.artboard');
      var W = 960, H = 612;
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        ab.style.transform = 'scale(' + s + ')';
        ab.style.transformOrigin = 'center center';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
