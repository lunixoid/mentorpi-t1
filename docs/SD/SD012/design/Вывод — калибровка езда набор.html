<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Вывод — калибровка езда набор</title>
<link rel="stylesheet" href="design-system/tokens.css">
</head>
<body class="artifact cli">
  <div class="stage">
    <div class="artboard" data-screen-label="calib-drive-hold">
      <div class="term-chrome">
        <span class="term-title">t1ctl — calib drive</span>
        <span class="term-meta">80×24</span>
      </div>
      <pre class="term" data-spec="cols: 80; rows: 24; command: t1ctl calib drive; stdout hold; motion: operator pad only; lang: en; stack: Clap; version: 1.4.1"><span class="prompt">$</span> <span class="cmd">t1ctl calib drive</span>
<span class="fg-muted">stage             </span>drive
  <span class="fg-muted">drive forward</span>
  <span class="fg-muted">you drive the pad; this command does not move the robot</span>
<span class="fg-muted">travel            </span>0.4 m
<span class="fg-muted">turn              </span>0 deg</pre>
    </div>
  </div>
  <script>
    (function () {
      var ab = document.querySelector('.artboard');
      var W = 960, H = 612;
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        ab.style.transform = 'scale(' + s + ')';
        ab.style.transformOrigin = 'center center';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
