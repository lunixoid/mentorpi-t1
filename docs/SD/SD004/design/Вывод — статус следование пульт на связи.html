<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Вывод — статус следование пульт на связи</title>
<link rel="stylesheet" href="design-system/tokens.css">
</head>
<body class="artifact cli">
  <div class="stage">
    <div class="artboard" data-screen-label="status-follow-pad">
      <div class="term-chrome">
        <span class="term-title">t1ctl — follow (pad)</span>
        <span class="term-meta">80×24</span>
      </div>
      <pre class="term" data-spec="cols: 80; rows: 24; command: t1ctl; alias: t1ctl status; stdout; exit: 0; state: follow+remote-active; lang: en; roles: muted=keys, ok=demo/chassis/remote-active, fg=mode"><span class="prompt">$</span> <span class="cmd">t1ctl</span>
<span class="fg-muted">demo        </span><span class="fg-ok">active</span>
<span class="fg-muted">stock       </span>inactive
<span class="fg-muted">chassis     </span><span class="fg-ok">active</span>
<span class="fg-muted">mode        </span>follow
<span class="fg-muted">remote      </span><span class="fg-ok">active</span>
<span class="fg-muted">version     </span>0.1.0</pre>
    </div>
  </div>
  <script>
    (function () {
      var ab = document.querySelector('.artboard');
      var W = 960, H = 612;
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        ab.style.transform = 'scale(' + s + ')';
        ab.style.transformOrigin = 'center center';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
