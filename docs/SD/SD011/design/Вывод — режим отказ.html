<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Вывод — режим отказ</title>
<link rel="stylesheet" href="design-system/tokens.css">
</head>
<body class="artifact cli">
  <div class="stage">
    <div class="artboard" data-screen-label="mode-error">
      <div class="term-chrome">
        <span class="term-title">t1ctl — mode error</span>
        <span class="term-meta">80×24</span>
      </div>
      <pre class="term" data-spec="cols: 80; rows: 24; command: t1ctl mode allow; stdout: kv + next-step; stderr: error block; exit: 1; state: container down; lang: en; roles: err=demo inactive and error prefix; stack: Clap; version: 1.4.0"><span class="prompt">$</span> <span class="cmd">t1ctl mode allow</span>
<span class="fg-muted">demo              </span><span class="fg-err">inactive</span>
<span class="fg-muted">stock             </span>inactive

<span class="bold fg-err">error:</span> mode change failed
  container mentorpi-t1 is not running
  /control/state has no publisher
  motion is not allowed

  t1ctl start</pre>
    </div>
  </div>
  <script>
    (function () {
      var ab = document.querySelector('.artboard');
      var W = 960, H = 612;
      function fit() {
        var s = Math.min(window.innerWidth / W, window.innerHeight / H);
        ab.style.transform = 'scale(' + s + ')';
        ab.style.transformOrigin = 'center center';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
